<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Welcome</title>
  <link rel="icon" type="image/png" href="assets/favicon.png">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #000; font-family: Arial, sans-serif; }

    /* ---------- Splash vidéo ---------- */
    #splash {
      position: fixed;
      inset: 0;
      z-index: 9999;
      background: #000;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    #splash video {
      max-width: 100%;
      max-height: 100%;
      width: auto;
      height: auto;
      object-fit: contain;
    }
    #splash .skip {
      position: absolute;
      bottom: 24px;
      right: 24px;
      color: rgba(255,255,255,0.6);
      font-size: 12px;
      letter-spacing: 0.02em;
      cursor: pointer;
      padding: 8px 14px;
      border: 1px solid rgba(255,255,255,0.25);
      border-radius: 20px;
      background: rgba(0,0,0,0.3);
      font-family: Arial, sans-serif;
    }
    #splash .skip:hover { color: #fff; border-color: rgba(255,255,255,0.6); }

    /* ---------- Page Welcome (cachée par défaut) ---------- */
    #welcome {
      display: none;
      position: fixed;
      inset: 0;
      background: #ffffff;
      z-index: 1;
    }
    /* Quand on active la page Welcome, on la montre INSTANTANÉMENT (aucune transition) */
    #welcome.actif {
      display: block;
    }

    #snake-canvas {
      position: absolute;
      inset: 0;
      z-index: 1;
    }

    .welcome-link {
      position: absolute;
      top: 24px;
      left: 24px;
      z-index: 10;
      font-family: Arial, sans-serif;
      font-size: 16px;
      color: #0000EE;
      text-decoration: underline;
      cursor: pointer;
    }
    .welcome-link:visited { color: #551A8B; }
    .welcome-link:hover { color: #FF0000; }

    .meta-info {
      position: absolute;
      bottom: 12px;
      left: 12px;
      font-family: Arial, sans-serif;
      font-size: 11px;
      color: #888;
      z-index: 10;
    }

    .visitor-counter {
      position: absolute;
      bottom: 12px;
      right: 12px;
      font-family: 'Courier New', Courier, monospace;
      font-size: 11px;
      color: #444;
      background: #FFFF99;
      padding: 4px 8px;
      border: 1px solid #999;
      z-index: 10;
    }

    /* Coeur + prénom au centre (derrière le serpent) */
    #coeur {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      z-index: 0;
      pointer-events: none;
    }
    #coeur text { font-family: Georgia, 'Times New Roman', serif; }

    /* Choix fille / garçon */
    #genre {
      position: absolute;
      top: 88px;
      left: 24px;
      z-index: 10;
      font-family: Arial, sans-serif;
      font-size: 13px;
      color: #444;
    }
    #genre label { margin-right: 14px; cursor: pointer; user-select: none; }
    #genre input { margin-right: 4px; cursor: pointer; }

    #hint {
      position: absolute;
      top: 60px;
      left: 24px;
      font-family: Arial, sans-serif;
      font-size: 11px;
      color: #aaa;
      z-index: 10;
    }
  </style>
</head>
<body>

  <!-- SPLASH VIDÉO -->
  <div id="splash">
    <video id="introVideo" playsinline muted autoplay preload="auto">
      <source src="assets/intro.mp4" type="video/mp4">
    </video>
    <div class="skip" onclick="finirSplash()">Passer</div>
  </div>

  <!-- PAGE WELCOME (cachée) -->
  <div id="welcome">
    <canvas id="snake-canvas"></canvas>
    <a href="raccourcis/" class="welcome-link">Welcome</a>
    <svg id="coeur" viewBox="0 0 100 90" width="240" height="216" xmlns="http://www.w3.org/2000/svg">
      <path d="M50 85 C10 55 0 30 15 15 C28 3 45 10 50 25 C55 10 72 3 85 15 C100 30 90 55 50 85 Z"
            fill="none" stroke="#ff4d6d" stroke-width="3"/>
      <text x="50" y="40" text-anchor="middle" dominant-baseline="middle" font-size="15" fill="#ff4d6d">
    </svg>
    <div id="hint">click "Welcome" to enter — or play with the snake (arrow keys)</div>
    <div id="genre">
      <label><input type="checkbox" id="chkFille"> Fille</label>
      <label><input type="checkbox" id="chkGarcon"> Garçon</label>
    </div>
    <div class="meta-info">
      Best viewed in Internet Explorer 6 — © 2026 Jet Set Corporation
    </div>
    <div class="visitor-counter">
      visitors: 000847
    </div>
  </div>

  <script>
    const splash = document.getElementById("splash");
    const welcome = document.getElementById("welcome");
    const video = document.getElementById("introVideo");
    let splashDone = false;

    function finirSplash() {
      if (splashDone) return;
      splashDone = true;

      // 1. On révèle la page Welcome DERRIÈRE la vidéo (invisible car splash z-index 9999)
      welcome.classList.add("actif");
      // On force le navigateur à peindre la page Welcome AVANT de retirer le splash
      welcome.offsetHeight; // reflow forcé
      // 2. On retire le splash instantanément — le Welcome est déjà peint dessous, aucun flash
      splash.remove();
      // 3. On démarre le snake maintenant que Welcome est visible
      initSnake();
    }

    video.addEventListener("ended", finirSplash);
    video.addEventListener("error", finirSplash);

    // Fallback : si la vidéo ne charge pas après 8s
    setTimeout(() => {
      if (!splashDone && video.readyState < 2) {
        finirSplash();
      }
    }, 8000);

    // ============ COULEUR DU SERPENT ============
    let snakeRGB = [42, 140, 42]; // vert par défaut
    const snakeColor = () => `rgb(${snakeRGB[0]},${snakeRGB[1]},${snakeRGB[2]})`;

    const chkFille = document.getElementById('chkFille');
    const chkGarcon = document.getElementById('chkGarcon');
    function majCouleur() {
      if (chkGarcon.checked) snakeRGB = [30, 111, 224];      // bleu
      else if (chkFille.checked) snakeRGB = [255, 105, 180]; // rose
      else snakeRGB = [42, 140, 42];                         // vert
    }
    // une seule case cochée à la fois
    chkGarcon.addEventListener('change', () => { if (chkGarcon.checked) chkFille.checked = false; majCouleur(); });
    chkFille.addEventListener('change', () => { if (chkFille.checked) chkGarcon.checked = false; majCouleur(); });

    // ============ SNAKE ============
    function initSnake() {
      const canvas = document.getElementById('snake-canvas');
      const ctx = canvas.getContext('2d');
      const hintEl = document.getElementById('hint');

      const CELL = 22;
      const RED = '#ff2222';
      const SPEED = 160;

      function resize() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
      }
      resize();
      window.addEventListener('resize', resize);

      const cols = () => Math.floor(canvas.width / CELL);
      const rows = () => Math.floor(canvas.height / CELL);

      const STATE = { WAITING: 'waiting', PLAYING: 'playing', DYING: 'dying' };
      let state = STATE.WAITING;

      let snake = null, dir = {x:1,y:0}, nextDir = {x:1,y:0}, food = null, particles = [];

      function startSnake() {
        const cx = Math.floor(cols()/2), cy = Math.floor(rows()/2);
        snake = [{x:cx,y:cy},{x:cx-1,y:cy},{x:cx-2,y:cy}];
        dir = {x:1,y:0}; nextDir = {x:1,y:0}; food = spawnFood();
        particles = []; state = STATE.PLAYING;
        hintEl.style.opacity = '0';
      }

      function spawnFood() {
        let f;
        do {
          f = {x: Math.floor(Math.random()*(cols()-2))+1, y: Math.floor(Math.random()*(rows()-2))+1};
        } while (snake && snake.some(s => s.x===f.x && s.y===f.y));
        return f;
      }

      function drawHead(x, y) {
        ctx.fillStyle = snakeColor();
        ctx.fillRect(x*CELL, y*CELL, CELL-1, CELL-1);
        ctx.fillStyle = '#fff';
        const es = Math.max(2, Math.floor(CELL/5)), off = Math.floor(CELL/4);
        if (dir.x===1) { ctx.fillRect(x*CELL+CELL-off-es, y*CELL+off, es, es); ctx.fillRect(x*CELL+CELL-off-es, y*CELL+CELL-off-es-1, es, es); }
        else if (dir.x===-1) { ctx.fillRect(x*CELL+off, y*CELL+off, es, es); ctx.fillRect(x*CELL+off, y*CELL+CELL-off-es-1, es, es); }
        else if (dir.y===-1) { ctx.fillRect(x*CELL+off, y*CELL+off, es, es); ctx.fillRect(x*CELL+CELL-off-es-1, y*CELL+off, es, es); }
        else { ctx.fillRect(x*CELL+off, y*CELL+CELL-off-es-1, es, es); ctx.fillRect(x*CELL+CELL-off-es-1, y*CELL+CELL-off-es-1, es, es); }
        ctx.fillStyle = RED;
        const ls = Math.max(2, Math.floor(CELL/7)), mx = x*CELL+Math.floor((CELL-1)/2), my = y*CELL+Math.floor((CELL-1)/2);
        if (dir.x===1) ctx.fillRect(x*CELL+CELL-1, my-ls, ls*2, ls);
        if (dir.x===-1) ctx.fillRect(x*CELL-ls*2, my-ls, ls*2, ls);
        if (dir.y===-1) ctx.fillRect(mx-ls, y*CELL-ls*2, ls, ls*2);
        if (dir.y===1) ctx.fillRect(mx-ls, y*CELL+CELL-1, ls, ls*2);
      }

      function triggerDeath() {
        state = STATE.DYING;
        particles = snake.map(seg => ({
          x: seg.x*CELL+Math.random()*CELL, y: seg.y*CELL+Math.random()*CELL,
          vy: 1+Math.random()*3, vx: (Math.random()-0.5)*2, size: CELL-1, alpha: 1
        }));
        snake = null; food = null;
      }

      function updateParticles() {
        particles.forEach(p => {
          p.vy += 0.4; p.y += p.vy; p.x += p.vx;
          const floor = canvas.height - p.size;
          if (p.y >= floor) { p.y = floor; p.vy = -p.vy*0.45; p.vx *= 0.8; if (Math.abs(p.vy)<0.8) { p.vy = 0; p.vx *= 0.9; } p.alpha -= 0.025; }
        });
        particles = particles.filter(p => p.alpha > 0);
        if (particles.length === 0) { state = STATE.WAITING; hintEl.style.opacity = '1'; }
      }

      function drawParticles() {
        particles.forEach(p => { ctx.fillStyle = `rgba(${snakeRGB[0]},${snakeRGB[1]},${snakeRGB[2]},${p.alpha})`; ctx.fillRect(p.x, p.y, p.size, p.size); });
      }

      let lastTick = 0;
      function update(ts) {
        if (state === STATE.PLAYING && ts-lastTick > SPEED) {
          lastTick = ts; dir = {...nextDir};
          const head = { x:(snake[0].x+dir.x+cols())%cols(), y:(snake[0].y+dir.y+rows())%rows() };
          if (head.x === food.x && head.y === food.y) { food = spawnFood(); }
          else snake.pop();
          if (snake.some(s => s.x===head.x && s.y===head.y)) { snake.unshift(head); triggerDeath(); return; }
          snake.unshift(head);
        }
        if (state === STATE.DYING) updateParticles();
      }

      function draw() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        if (state === STATE.PLAYING && snake) {
          for (let i=1; i<snake.length; i++) { ctx.fillStyle = snakeColor(); ctx.fillRect(snake[i].x*CELL, snake[i].y*CELL, CELL-1, CELL-1); }
          drawHead(snake[0].x, snake[0].y);
          const pulse = 0.5 + 0.5 * Math.sin(Date.now()/200);
          ctx.fillStyle = `rgba(255,34,34,${pulse})`;
          ctx.fillRect(food.x*CELL, food.y*CELL, CELL-1, CELL-1);
        }
        if (state === STATE.DYING) drawParticles();
      }

      function loop(ts) { update(ts); draw(); requestAnimationFrame(loop); }
      requestAnimationFrame(loop);

      const KEYS = ['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','z','q','s','d'];
      document.addEventListener('keydown', e => {
        if (!KEYS.includes(e.key)) return;
        if (['ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.key)) e.preventDefault();
        if (state === STATE.WAITING) { startSnake(); return; }
        if (state !== STATE.PLAYING) return;
        if ((e.key==='ArrowUp'||e.key==='z') && dir.y!==1) nextDir = {x:0,y:-1};
        if ((e.key==='ArrowDown'||e.key==='s') && dir.y!==-1) nextDir = {x:0,y:1};
        if ((e.key==='ArrowLeft'||e.key==='q') && dir.x!==1) nextDir = {x:-1,y:0};
        if ((e.key==='ArrowRight'||e.key==='d') && dir.x!==-1) nextDir = {x:1,y:0};
      });
    }
  </script>
</body>
</html>
